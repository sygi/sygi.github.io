id: 13
title: Hospital de Sant Pau
location:
  lat: 41.41168
  lon: 2.17429
introduction: |
  Ah, the Hospital de Sant Pau! A true symphony of healing and beauty, though not of my hand,
  it certainly speaks a language I understand. Domènech i Montaner, a kindred spirit indeed,
  understood that light and nature are the truest medicines. Observe the grand entrance, a
  gateway to well-being.
challenge:
  title: The Symbol of Healing
  question: |
    Stand before the main entrance of the Hospital de Sant Pau. Look carefully at the architectural
    details adorning the facade. Among the rich modernista decoration, above the doors to the
    right pavilion, you'll find a creature from a
    Catalan legend that serves as a protective symbol. This mythical beast, deeply rooted in
    Catalonian culture and often seen throughout Barcelona, stands guard over this place of healing.
    What legendary creature watches over the entrance?
  answer: Dragon
success_text: |
  Hospital de Sant Pau. Not mine, but a cousin in spirit—Lluís Domènech i Montaner's
  masterwork. Built from 1902 to 1930, this is not a hospital of gray walls, but of healing
  gardens. Look! Mosaics, ceramic domes, and stained glass bloom like a curative forest.

  Yes, the dragon—that ancient guardian of Catalonia! Here it watches over the threshold,
  a symbol of the eternal battle against illness and suffering. In our Catalan tradition,
  dragons are not mere monsters but protective spirits, fierce defenders of what is precious.
  What better sentinel for a place dedicated to healing? Each pavilion was a separate medical
  specialty, linked by underground tunnels to keep the gardens quiet. It's a modernista
  utopia—medicine joined with art, sunlight, air, and dignity. Domènech believed, as I do,
  that beauty is part of health. Today, the historical site is open to visitors; the modern
  hospital functions elsewhere. From the street, admire how brick, tile, and sculpture unite
  science and soul.
